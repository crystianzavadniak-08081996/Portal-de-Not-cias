<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- para configurar fontes, ir em google fonts e get code. colcar as 3 linhas aqui e a ultima linha de link href, colocar la no final do Head -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias</title>
  <!-- sempre linkar o HTML com o Index.CSS -->
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="container">
    <nav id="primary" class="grid grid-flow-col">
      <div>
        <img src="assets/icons/List.svg" 
        alt="Menu Icon"
        class="menu-icon">
        <strong>Menu</strong>
      </div>
      <div>
        <img src="assets/Logo-Tech News.svg" alt="Logo Tech News">
      </div>
      <div>
        <strong>Buscar</strong>
        <img src="assets/icons/MagnifyingGlass.svg" alt="MagnifyingGlass Search Icon">
      </div>
    </nav>
    <nav id="secondary" class="grid grid-flow-col">
      <a href="#">Inteligência Artificial</a>
      <a href="#">Blockchain</a>
      <a href="#">Hologramas</a>
      <a href="#">Internet</a>
      <a href="#">Vestíveis</a>
      <a href="#">Realidade Aumentada</a>
      <a href="#">Realidade  Virtual</a>
    </nav>
  </header>

  <main class="grid container">
    <section id="featured" class="grid grid-flow-col gap-16">
      <!-- normalmente colocamos FIGURE quando queremos que o elemento contenha uma informacao extra, por exemplo: figcaption. Dessa forma nao fica um monte de Divs espalhadas por todo o lado. -->
      <figure class="card">
        <img src="assets/images/Image 01.png" alt="robo parado dentro do quarto">
        <figcaption>
          <span class="content-tag">Robotica</span>
          <h2 class="text-2xl">
            Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.</h2>
        </figcaption>
      </figure>
      <div class="grid grid-cols-2 gap-16">
        <div>
          <img src="assets/images/Image 02.png" alt="">
        </div>
        <div>
          <img src="assets/images/Image 03.png" alt="">
        </div>
         <div>
          <img src="assets/images/Image 04.png" alt="">
        </div>
         <div>
          <img src="assets/images/Image 05.png" alt="">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
